server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pg-operations-db?currentSchema=operations_service
    username: ${PSQL_USER}
    password: ${PSQL_PASSWORD}
  kafka:
    consumer:
      group-id: operations-service
  cloud:
    openfeign:
      client:
        config:
          merchant-service:
            connectTimeout: 2000
            readTimeout: 3000
          vault-service:
            connectTimeout: 2000
            readTimeout: 5000

resilience4j:
  circuitbreaker:
    instances:
      merchant-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      payment-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      merchant-service:
        max-attempts: 3
        wait-duration: 500ms
      payment-service:
        max-attempts: 3
        wait-duration: 500ms

app:
  webhook:
    delivery:
      redis-key: webhook-retry
      poll-batch-size: 100
