server:
    port: 8083

spring:
    datasource:
        url: jdbc:postgresql://localhost:5432/${PSQL_DATABASE_PAYMENT}?currentSchema=payment_service
        username: ${PSQL_USER}
        password: ${PSQL_PASSWORD}
    jpa:
        properties:
            hibernate:
                default_schema: payment_service

payment:
    simulator:
        # monolith had "poll-intercal-ms" (typo) and "method" — neither ever bound
        poll-interval-ms: 5000
        chaos-mode: NORMAL
        methods:
            CARD:
                min-delay-seconds: 2
                max-delay-second: 6
                success-rate: 90
            UPI:
                min-delay-seconds: 1
                max-delay-second: 3
                success-rate: 95
            NET-BANKING:
                min-delay-seconds: 4
                max-delay-second: 10
                success-rate: 80
