# Shared defaults for every service. Overridden by <service-name>.yaml
eureka:
    client:
        serviceUrl:
            defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    instance:
        prefer-ip-address: true

spring:
    datasource:
        driver-class-name: org.postgresql.Driver

    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            password: ${REDIS_PASSWORD}

    jpa:
        hibernate:
            ddl-auto: create
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect

    kafka:
        # compose advertises localhost:9092 (was 29092 in the monolith setup)
        bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
        producer:
            ack-mode: manual
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
            properties:
                enable.idempotence: true
                max.in.flight.requests.per.connection: 5
                retries: 3
                spring.json.add.type.headers: false
        consumer:
            auto-offset-reset: earliest
            enable-auto-commit: false
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
            properties:
                spring.json.trusted.packages: "com.saswat.razorpay.*"
                spring.json.use.type.headers: false
                spring.json.value.default.type: java.util.LinkedHashMap

    threads:
        virtual:
            enabled: true

app:
    rate-limit:
        method: fixed
        use-case:
            api-key:
                requests-per-minute: 200
    kafka:
        topics:
            # singular keys: used by KafkaProperties.topicFor(EventAggregateType)
            payment: payments.events
            order: orders.events
            refund: refund.events
            settlement: settlement.events
            # plural keys: used by operations-service @KafkaListener placeholders
            payments: payments.events
            orders: orders.events
            refunds: refund.events
            settlements: settlement.events
