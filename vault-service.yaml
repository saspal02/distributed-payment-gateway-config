server:
  port: 9040

app:
  openapi:
    title: Vault Service
    description: Card vault and charge API
    version: v1

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/paygrid-vault-db
    username: ${PSQL_USER}
    password: ${PSQL_PASSWORD}

vault:
  master-key: ${VAULT_MASTER_KEY}

resilience4j:
  thread-pool-bulkhead:
    instances:
      vault-card-processor:
        core-thread-pool-size: 5
        max-thread-pool-size: 10
        queue-capacity: 20

---

spring:
  config:
    activate:
      on-profile: k8s
  datasource:
    url: jdbc:postgresql://postgres.paygrid-core.svc.cluster.local:5432/paygrid-vault-db
    username: vault_user
    password: ${VAULT_DB_PASSWORD}

vault:
  master-key: ${VAULT_MASTER_KEY}
